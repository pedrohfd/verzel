services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: verzel
      POSTGRES_PASSWORD: verzel
      POSTGRES_DB: verzel
    ports:
      - "5433:5432"
    volumes:
      - verzel_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U verzel -d verzel"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  verzel_postgres_data:
